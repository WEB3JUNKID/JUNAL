<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0914">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <title>Euphoria Journal</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary-glow: #b14bf4;
            --secondary-glow: #00d2ff;
            --bg-color: #0b0914;
            --glass-bg: rgba(20, 15, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, #1a0b2e 0%, var(--bg-color) 40%, #060b19 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .auth-wrapper, .container {
            width: 100%; max-width: 800px;
            box-sizing: border-box; padding: 20px;
        }

        .auth-box {
            background: rgba(0,0,0,0.8); padding: 30px;
            border-radius: 12px; border: 1px solid var(--glass-border);
            text-align: center; margin-top: 50px;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            min-height: 100vh; display: none;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px;
        }

        h1 {
            margin: 0; font-size: 1.8rem;
            background: linear-gradient(to right, var(--secondary-glow), var(--primary-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 2px;
        }

        #calendar-info { color: #a09cbb; font-size: 1rem; font-weight: 500; }

        /* ── Dashboard Grid ── */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: rgba(0,0,0,0.35);
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-card.accent-left  { border-left: 3px solid var(--secondary-glow); }
        .stat-card.accent-right { border-left: 3px solid var(--primary-glow); }
        .stat-card.accent-green { border-left: 3px solid #00ffcc; }
        .stat-card.accent-gold  { border-left: 3px solid #f4c430; }

        .stat-label { font-size: 0.75rem; color: #a09cbb; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 1.3rem; font-weight: bold; }

        /* ── Account Size Row ── */
        .capital-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 20px;
        }

        .capital-row label {
            font-size: 0.78rem;
            color: #a09cbb;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .capital-row input {
            flex: 1;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            width: auto;
            box-sizing: border-box;
        }

        .capital-row input:focus {
            border-color: var(--primary-glow);
            background: rgba(255,255,255,0.1);
        }

        .capital-save-btn {
            padding: 8px 14px !important;
            font-size: 0.78rem !important;
            width: auto !important;
            margin-top: 0 !important;
            border-radius: 6px !important;
            background: linear-gradient(45deg, var(--primary-glow), #7a1fd4) !important;
            white-space: nowrap;
        }

        /* ── Chart ── */
        .chart-wrapper {
            background: rgba(0,0,0,0.2); padding: 15px;
            border-radius: 12px; border: 1px solid var(--glass-border);
            margin-bottom: 25px; height: 250px;
        }

        /* ── Form ── */
        form, .auth-form {
            display: flex; flex-direction: column; gap: 15px;
            background: rgba(0,0,0,0.2); padding: 20px;
            border-radius: 12px; border: 1px solid var(--glass-border); margin-bottom: 25px;
        }

        input, select, button {
            padding: 14px 15px; border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: #fff; font-size: 1rem; outline: none;
            width: 100%; box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--primary-glow);
            background: rgba(255, 255, 255, 0.1);
        }

        select option { background: var(--bg-color); color: #fff; }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.85rem; color: #a09cbb; text-transform: uppercase; }

        #custom-rr-group,
        #custom-pair-group,
        #amount-group { display: none; }

        button {
            background: linear-gradient(45deg, var(--primary-glow), #7a1fd4);
            cursor: pointer; font-weight: bold;
            text-transform: uppercase; border: none; margin-top: 5px;
        }

        .secondary-btn { background: #333; }
        .logout-btn {
            background: transparent; border: 1px solid #ff3366;
            color: #ff3366; padding: 8px 12px; font-size: 0.8rem; width: auto;
        }

        /* ── Table ── */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 350px; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem; }
        th { color: #a09cbb; text-transform: uppercase; font-size: 0.8rem; }
        .win  { color: #00ffcc; font-weight: bold; }
        .loss { color: #ff3366; font-weight: bold; }
        .delete-btn {
            background: transparent; color: #ff3366;
            padding: 6px; font-size: 0.8rem;
            border: 1px solid #ff3366; width: auto;
        }

        /* ── Delete Modal ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #130d26;
            border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 30px 24px;
            max-width: 320px; width: 90%;
            text-align: center;
            box-shadow: 0 0 40px rgba(177,75,244,0.2);
        }
        .modal-box p  { margin: 0 0 8px; font-size: 1rem; font-weight: 600; color: #fff; }
        .modal-box span { font-size: 0.85rem; color: #a09cbb; }

        .modal-actions { display: flex; gap: 12px; margin-top: 22px; }
        .modal-actions button { flex: 1; padding: 12px; font-size: 0.9rem; margin-top: 0; }
        .modal-yes { background: linear-gradient(45deg, #ff3366, #c0003a) !important; border: none; }
        .modal-no  { background: #222 !important; border: 1px solid var(--glass-border) !important; color: #a09cbb !important; }
    </style>
</head>
<body>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-box">
            <p>Delete this trade?</p>
            <span>This action cannot be undone.</span>
            <div class="modal-actions">
                <button class="modal-yes" id="modal-yes-btn">Yes, Delete</button>
                <button class="modal-no"  id="modal-no-btn">No, Keep</button>
            </div>
        </div>
    </div>

    <!-- Auth Screen -->
    <div class="auth-wrapper" id="auth-container">
        <div class="auth-box">
            <h2>System Login</h2>
            <div class="auth-form">
                <input type="email"     id="email"    placeholder="Email Address" required>
                <input type="password"  id="password" placeholder="Password"      required>
                <div style="display:flex; gap:10px;">
                    <button id="login-btn">Login</button>
                    <button id="signup-btn" class="secondary-btn">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="container" id="app-container">
        <header>
            <div>
                <h1>Trade Journal</h1>
                <div id="calendar-info">Loading...</div>
            </div>
            <button id="logout-btn" class="logout-btn">Logout</button>
        </header>

        <!-- 4-stat Dashboard Grid -->
        <div class="dashboard">
            <div class="stat-card accent-left">
                <span class="stat-label">Monthly PnL</span>
                <span id="total-rr-display" class="stat-value" style="color: var(--secondary-glow);">0.00 RR</span>
            </div>
            <div class="stat-card accent-right">
                <span class="stat-label">Profit Factor</span>
                <span id="pf-display" class="stat-value">0.00</span>
            </div>
            <div class="stat-card accent-green">
                <span class="stat-label">Net $ P&L</span>
                <span id="net-usd-display" class="stat-value" style="color:#00ffcc;">$0.00</span>
            </div>
            <div class="stat-card accent-gold">
                <span class="stat-label">ROI %</span>
                <span id="roi-display" class="stat-value" style="color:#f4c430;">0.00%</span>
            </div>
        </div>

        <!-- Account / Starting Capital -->
        <div class="capital-row">
            <label for="account-size-input">Account Size ($)</label>
            <input type="number" id="account-size-input" placeholder="e.g. 1000" inputmode="decimal" min="1">
            <button class="capital-save-btn" id="save-capital-btn">Save</button>
        </div>

        <!-- Equity Chart -->
        <div class="chart-wrapper">
            <canvas id="equityChart"></canvas>
        </div>

        <!-- Trade Entry Form -->
        <form id="trade-form">
            <div class="input-group">
                <label for="pair">Pair</label>
                <select id="pair" required>
                    <option value="" disabled selected>Select Pair</option>
                    <option value="BTC/USD">BTC/USD</option>
                    <option value="GBP/USD">GBP/USD</option>
                    <option value="GBP/JPY">GBP/JPY</option>
                    <option value="USD/JPY">USD/JPY</option>
                    <option value="USD/CAD">USD/CAD</option>
                    <option value="EUR/USD">EUR/USD</option>
                    <option value="AUD/USD">AUD/USD</option>
                    <option value="GER40">GER40</option>
                    <option value="Other">Other (Custom)</option>
                </select>
            </div>

            <div class="input-group" id="custom-pair-group">
                <label for="custom-pair">Custom Pair Name</label>
                <input type="text" id="custom-pair" placeholder="e.g. XAU/USD">
            </div>

            <div class="input-group">
                <label for="bias">Bias</label>
                <select id="bias" required>
                    <option value="" disabled selected>Select Bias</option>
                    <option value="Long">Long</option>
                    <option value="Short">Short</option>
                </select>
            </div>

            <div class="input-group">
                <label for="outcome">Outcome</label>
                <select id="outcome" required>
                    <option value="" disabled selected>Win or Loss?</option>
                    <option value="Win">Win (+)</option>
                    <option value="Loss">Loss (-1)</option>
                </select>
            </div>

            <!-- Profit RR — shown on Win -->
            <div class="input-group" id="custom-rr-group">
                <label for="custom-rr">Profit RR (+)</label>
                <input type="number" id="custom-rr" step="0.1" min="0.1" placeholder="e.g. 2.5" inputmode="decimal">
            </div>

            <!-- Dollar amount — shown on Win OR Loss -->
            <div class="input-group" id="amount-group">
                <label for="trade-amount" id="amount-label">Amount ($)</label>
                <input type="number" id="trade-amount" step="0.01" min="0.01" placeholder="e.g. 45.00" inputmode="decimal">
            </div>

            <button type="submit">Log Trade</button>
        </form>

        <!-- Trade Table -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Pair</th>
                        <th>Result</th>
                        <th>RR</th>
                        <th>$</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="trade-list"></tbody>
            </table>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed:', err));
            });
        }
    </script>

    <script type="module">
        import { auth, db, tradesCol, addDoc, deleteDoc, doc, query, orderBy, where, onSnapshot, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from './firebase.js';
        import { initChart, updateChart } from './chart.js';

        let trades = [];
        let currentUser = null;
        let unsubscribeSnapshot = null;
        let pendingDeleteId = null;

        // ── DOM ──────────────────────────────────────────────────
        const authContainer   = document.getElementById('auth-container');
        const appContainer    = document.getElementById('app-container');
        const dateDisplay     = document.getElementById('calendar-info');
        const form            = document.getElementById('trade-form');
        const outcomeSelect   = document.getElementById('outcome');
        const customRrGroup   = document.getElementById('custom-rr-group');
        const customRrInput   = document.getElementById('custom-rr');
        const pairSelect      = document.getElementById('pair');
        const customPairGroup = document.getElementById('custom-pair-group');
        const customPairInput = document.getElementById('custom-pair');
        const amountGroup     = document.getElementById('amount-group');
        const amountInput     = document.getElementById('trade-amount');
        const amountLabel     = document.getElementById('amount-label');
        const deleteModal     = document.getElementById('delete-modal');
        const capitalInput    = document.getElementById('account-size-input');

        // ── Account Size (localStorage) ──────────────────────────
        let accountSize = parseFloat(localStorage.getItem('euphoriaAccountSize')) || 0;
        if (accountSize > 0) capitalInput.value = accountSize;

        document.getElementById('save-capital-btn').addEventListener('click', () => {
            const val = parseFloat(capitalInput.value);
            if (!val || val <= 0) { alert('Enter a valid account size.'); return; }
            accountSize = val;
            localStorage.setItem('euphoriaAccountSize', val);
            renderDashboard();
        });

        // ── Calendar Helper ──────────────────────────────────────
        function getCalendarInfo() {
            const now = new Date();
            const month = now.toLocaleString('default', { month: 'long' });
            const dayOfMonth = now.getDate();
            let week = Math.ceil(dayOfMonth / 7);
            if (week > 4) week = 4;
            return { month, week, fullDate: now.toLocaleDateString() };
        }
        dateDisplay.textContent = `${getCalendarInfo().month} - Wk ${getCalendarInfo().week}`;

        // ── Auth ─────────────────────────────────────────────────
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authContainer.style.display = 'none';
                appContainer.style.display  = 'block';
                initChart('equityChart');
                loadUserTrades(user.uid);
            } else {
                currentUser = null;
                authContainer.style.display = 'block';
                appContainer.style.display  = 'none';
                if (unsubscribeSnapshot) unsubscribeSnapshot();
            }
        });

        document.getElementById('login-btn').addEventListener('click', async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
            } catch (e) { alert("Login failed: " + e.message); }
        });

        document.getElementById('signup-btn').addEventListener('click', async () => {
            try {
                await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
            } catch (e) { alert("Signup failed: " + e.message); }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // ── Pair select ──────────────────────────────────────────
        pairSelect.addEventListener('change', () => {
            if (pairSelect.value === 'Other') {
                customPairGroup.style.display = 'flex';
                customPairInput.required = true;
            } else {
                customPairGroup.style.display = 'none';
                customPairInput.required = false;
                customPairInput.value = '';
            }
        });

        // ── Outcome select ───────────────────────────────────────
        outcomeSelect.addEventListener('change', (e) => {
            const isWin = e.target.value === 'Win';

            // RR input only for wins
            customRrGroup.style.display = isWin ? 'flex' : 'none';
            customRrInput.required      = isWin;
            if (!isWin) customRrInput.value = '';

            // Dollar amount for both outcomes
            amountGroup.style.display = 'flex';
            amountInput.required      = true;
            amountLabel.textContent   = isWin ? 'Amount Gained ($)' : 'Amount Lost ($)';
        });

        // ── Delete Modal ─────────────────────────────────────────
        function openDeleteModal(id) { pendingDeleteId = id; deleteModal.classList.add('active'); }
        function closeDeleteModal()  { pendingDeleteId = null; deleteModal.classList.remove('active'); }

        document.getElementById('modal-yes-btn').addEventListener('click', async () => {
            if (pendingDeleteId) await deleteDoc(doc(db, 'trades', pendingDeleteId));
            closeDeleteModal();
        });
        document.getElementById('modal-no-btn').addEventListener('click', closeDeleteModal);
        deleteModal.addEventListener('click', (e) => { if (e.target === deleteModal) closeDeleteModal(); });

        // ── Render Dashboard + Table ─────────────────────────────
        function renderDashboard() {
            const list         = document.getElementById('trade-list');
            const totalDisplay = document.getElementById('total-rr-display');
            const pfDisplay    = document.getElementById('pf-display');
            const netUsdEl     = document.getElementById('net-usd-display');
            const roiEl        = document.getElementById('roi-display');
            list.innerHTML     = '';

            const currentMonth       = getCalendarInfo().month;
            let monthlyGrossProfit   = 0;
            let monthlyGrossLoss     = 0;
            let monthlyNetRR         = 0;
            let monthlyNetUSD        = 0;

            let chartLabels  = ['Start'];
            let chartData    = [0];
            let cumulativeRR = 0;

            const sorted = [...trades].sort((a, b) => a.timestamp - b.timestamp);

            sorted.forEach(trade => {
                cumulativeRR += trade.rr;
                chartLabels.push(trade.date);
                chartData.push(parseFloat(cumulativeRR.toFixed(2)));

                if (trade.month === currentMonth) {
                    monthlyNetRR  += trade.rr;
                    monthlyNetUSD += (trade.amount || 0);
                    if (trade.rr > 0) monthlyGrossProfit += trade.rr;
                    if (trade.rr < 0) monthlyGrossLoss   += Math.abs(trade.rr);
                }
            });

            updateChart(chartLabels, chartData);

            // Profit Factor
            let profitFactor;
            if (monthlyGrossLoss === 0) {
                profitFactor = monthlyGrossProfit > 0 ? 'Max' : '0.00';
            } else {
                profitFactor = (monthlyGrossProfit / monthlyGrossLoss).toFixed(2);
            }

            // ROI %
            let roiText = 'N/A';
            if (accountSize > 0) {
                const roi = (monthlyNetUSD / accountSize) * 100;
                roiText   = `${roi >= 0 ? '+' : ''}${roi.toFixed(2)}%`;
            }

            // ── Table rows ───────────────────────────────────────
            [...sorted].reverse().forEach(trade => {
                const tr      = document.createElement('tr');
                const cls     = trade.outcome === 'Win' ? 'win' : 'loss';
                const rrPfx   = trade.outcome === 'Win' ? '+' : '';
                const amt     = trade.amount != null ? trade.amount : null;
                const amtText = amt != null
                    ? `<span class="${cls}">${amt >= 0 ? '+' : ''}$${Math.abs(amt).toFixed(2)}</span>`
                    : '<span style="color:#555">—</span>';

                tr.innerHTML = `
                    <td>
                        <div style="font-size:0.85rem;">${trade.date}</div>
                        <div style="font-size:0.7rem;color:#a09cbb;">Wk ${trade.week}</div>
                    </td>
                    <td>
                        <div style="font-weight:bold;">${trade.pair}</div>
                        <div style="font-size:0.7rem;color:#a09cbb;">${trade.bias}</div>
                    </td>
                    <td class="${cls}">${trade.outcome}</td>
                    <td class="${cls}">${rrPfx}${trade.rr}</td>
                    <td>${amtText}</td>
                    <td><button class="delete-btn" data-id="${trade.id}">X</button></td>
                `;
                list.appendChild(tr);
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => openDeleteModal(e.target.getAttribute('data-id')));
            });

            // ── Stat cards ───────────────────────────────────────
            totalDisplay.textContent = `${monthlyNetRR > 0 ? '+' : ''}${monthlyNetRR.toFixed(2)} RR`;
            totalDisplay.style.color = monthlyNetRR >= 0 ? '#00d2ff' : '#ff3366';

            pfDisplay.textContent = profitFactor;

            netUsdEl.textContent = `${monthlyNetUSD >= 0 ? '+' : ''}$${Math.abs(monthlyNetUSD).toFixed(2)}`;
            netUsdEl.style.color = monthlyNetUSD >= 0 ? '#00ffcc' : '#ff3366';

            roiEl.textContent = roiText;
            roiEl.style.color = accountSize > 0
                ? (monthlyNetUSD >= 0 ? '#f4c430' : '#ff3366')
                : '#555';
        }

        // ── Firestore ────────────────────────────────────────────
        function loadUserTrades(uid) {
            const q = query(tradesCol, where('userId', '==', uid), orderBy('timestamp', 'desc'));
            unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                trades = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderDashboard();
            });
        }

        // ── Submit ───────────────────────────────────────────────
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const pair    = pairSelect.value === 'Other'
                            ? customPairInput.value.trim().toUpperCase()
                            : pairSelect.value;
            const bias    = document.getElementById('bias').value;
            const outcome = outcomeSelect.value;
            const rrValue = outcome === 'Loss' ? -1 : parseFloat(customRrInput.value);
            const info    = getCalendarInfo();

            // Dollar amount: positive for win, negative for loss
            const rawAmt  = parseFloat(amountInput.value);
            const amount  = isNaN(rawAmt) ? 0 : (outcome === 'Loss' ? -Math.abs(rawAmt) : Math.abs(rawAmt));

            const newTrade = {
                userId: currentUser.uid,
                timestamp: Date.now(),
                date: info.fullDate,
                month: info.month,
                week: info.week,
                pair, bias, outcome,
                rr: rrValue,
                amount
            };

            await addDoc(tradesCol, newTrade);
            form.reset();
            customRrGroup.style.display   = 'none';
            customPairGroup.style.display = 'none';
            amountGroup.style.display     = 'none';
        });
    </script>
</body>
</html>
