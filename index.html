<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0914">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <title>Euphoria Journal</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary-glow: #b14bf4;
            --secondary-glow: #00d2ff;
            --bg-color: #0b0914;
            --glass-bg: rgba(20, 15, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, #1a0b2e 0%, var(--bg-color) 40%, #060b19 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .auth-wrapper, .container {
            width: 100%; max-width: 800px;
            box-sizing: border-box; padding: 20px;
        }

        .auth-box {
            background: rgba(0,0,0,0.8); padding: 30px;
            border-radius: 12px; border: 1px solid var(--glass-border);
            text-align: center; margin-top: 50px;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            min-height: 100vh; display: none;
        }

        header {
            margin-bottom: 25px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px;
        }

        .navbar {
            display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 10px;
        }

        .nav-controls {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        }

        h1 {
            margin: 0; font-size: 1.8rem;
            background: linear-gradient(to right, var(--secondary-glow), var(--primary-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 2px;
        }

        #calendar-info { color: #a09cbb; font-size: 1rem; font-weight: 500; margin-top: 5px; }

        .dashboard {
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
            background: rgba(0,0,0,0.3); padding: 15px 20px;
            border-radius: 12px; margin-bottom: 20px;
            border-left: 4px solid var(--secondary-glow);
        }

        .stat-box { display: flex; flex-direction: column; flex: 1; min-width: 80px; }
        .stat-label { font-size: 0.85rem; color: #a09cbb; text-transform: uppercase; margin-bottom: 4px; }
        .stat-value { font-size: 1.3rem; font-weight: bold; }

        .chart-wrapper {
            background: rgba(0,0,0,0.2); padding: 15px;
            border-radius: 12px; border: 1px solid var(--glass-border);
            margin-bottom: 25px; height: 250px;
        }

        form, .auth-form {
            display: flex; flex-direction: column; gap: 15px;
            background: rgba(0,0,0,0.2); padding: 20px;
            border-radius: 12px; border: 1px solid var(--glass-border); margin-bottom: 25px;
        }

        input, select, button {
            padding: 14px 15px; border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: #fff; font-size: 1rem; outline: none;
            width: 100%; box-sizing: border-box;
        }

        select { padding: 10px 15px; }

        input:focus, select:focus {
            border-color: var(--primary-glow);
            background: rgba(255, 255, 255, 0.1);
        }

        select option { background: var(--bg-color); color: #fff; }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.85rem; color: #a09cbb; text-transform: uppercase; }

        #custom-rr-group, #custom-pair-group { display: none; }

        button {
            background: linear-gradient(45deg, var(--primary-glow), #7a1fd4);
            cursor: pointer; font-weight: bold;
            text-transform: uppercase; border: none; margin-top: 5px;
        }

        .secondary-btn { background: #333; }
        
        .header-btn {
            padding: 8px 12px; font-size: 0.8rem; width: auto; margin-top: 0;
        }

        .logout-btn {
            background: transparent; border: 1px solid #ff3366; color: #ff3366;
        }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 450px; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem; }
        th { color: #a09cbb; text-transform: uppercase; font-size: 0.8rem; }
        .win { color: #00ffcc; font-weight: bold; }
        .loss { color: #ff3366; font-weight: bold; }
        .delete-btn {
            background: transparent; color: #ff3366;
            padding: 6px; font-size: 0.8rem;
            border: 1px solid #ff3366; width: auto; margin-top: 0;
        }

        /* ── Modal Styles ── */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #130d26;
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 30px 24px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 40px rgba(177, 75, 244, 0.2);
        }

        .modal-box p, .modal-box h2 { margin: 0 0 8px; font-size: 1.2rem; font-weight: 600; color: #fff; }
        .modal-box span { font-size: 0.85rem; color: #a09cbb; }
        .modal-actions { display: flex; gap: 12px; margin-top: 22px; }
        .modal-actions button { flex: 1; padding: 12px; font-size: 0.9rem; margin-top: 0; }
        .modal-yes { background: linear-gradient(45deg, #ff3366, #c0003a) !important; border: none; }
        .modal-no { background: #222 !important; border: 1px solid var(--glass-border) !important; color: #a09cbb !important; }
    </style>
</head>
<body>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-box">
            <p>Delete this trade?</p>
            <span>This action cannot be undone.</span>
            <div class="modal-actions">
                <button class="modal-yes" id="modal-yes-btn">Yes, Delete</button>
                <button class="modal-no" id="modal-no-btn">No, Keep</button>
            </div>
        </div>
    </div>

    <!-- Setup New Trade Plan Modal -->
    <div class="modal-overlay" id="plan-modal">
        <div class="modal-box" style="max-width: 400px;">
            <h2>Create New Trade Plan</h2>
            <span>Set up your prop firm or personal account to start journaling.</span>
            <form id="plan-form" style="background: transparent; border: none; padding: 10px 0 0 0; margin: 0;">
                <input type="text" id="trader-name" placeholder="Your First Name" required>
                <input type="text" id="account-name" placeholder="Account Name (e.g. 50k FTMO)" required>
                <input type="number" id="account-size" placeholder="Account Size ($)" required>
                <button type="submit">Save & Start</button>
            </form>
        </div>
    </div>

    <!-- Login/Signup -->
    <div class="auth-wrapper" id="auth-container">
        <div class="auth-box">
            <h2>System Login</h2>
            <div class="auth-form">
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                <div style="display: flex; gap: 10px;">
                    <button id="login-btn">Login</button>
                    <button id="signup-btn" class="secondary-btn">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div class="container" id="app-container">
        <header>
            <div class="navbar">
                <div>
                    <h1 id="welcome-msg">Welcome, Trader</h1>
                    <div id="calendar-info">Loading...</div>
                </div>
                <div class="nav-controls">
                    <select id="account-selector" style="width: auto;"></select>
                    <button id="new-plan-btn" class="secondary-btn header-btn">New Plan</button>
                    <button id="logout-btn" class="logout-btn header-btn">Logout</button>
                </div>
            </div>
        </header>

        <div class="dashboard">
            <div class="stat-box">
                <span class="stat-label">Net RR</span>
                <span id="total-rr-display" class="stat-value" style="color: var(--secondary-glow);">0.00 RR</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Total PnL</span>
                <span id="total-pnl-display" class="stat-value">$0.00</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">ROI %</span>
                <span id="roi-display" class="stat-value">0.00%</span>
            </div>
            <div class="stat-box" style="text-align: right;">
                <span class="stat-label">Profit Factor</span>
                <span id="pf-display" class="stat-value">0.00</span>
            </div>
        </div>

        <div class="chart-wrapper">
            <canvas id="equityChart"></canvas>
        </div>

        <form id="trade-form">
            <div class="input-group">
                <label for="pair">Pair</label>
                <select id="pair" required>
                    <option value="" disabled selected>Select Pair</option>
                    <option value="BTC/USD">BTC/USD</option>
                    <option value="GBP/USD">GBP/USD</option>
                    <option value="GBP/JPY">GBP/JPY</option>
                    <option value="USD/JPY">USD/JPY</option>
                    <option value="USD/CAD">USD/CAD</option>
                    <option value="EUR/USD">EUR/USD</option>
                    <option value="AUD/USD">AUD/USD</option>
                    <option value="GER40">GER40</option>
                    <option value="Other">Other (Custom)</option>
                </select>
            </div>

            <div class="input-group" id="custom-pair-group">
                <label for="custom-pair">Custom Pair Name</label>
                <input type="text" id="custom-pair" placeholder="e.g. XAU/USD">
            </div>

            <div class="input-group">
                <label for="bias">Bias</label>
                <select id="bias" required>
                    <option value="" disabled selected>Select Bias</option>
                    <option value="Long">Long</option>
                    <option value="Short">Short</option>
                </select>
            </div>

            <div class="input-group">
                <label for="outcome">Outcome</label>
                <select id="outcome" required>
                    <option value="" disabled selected>Win or Loss?</option>
                    <option value="Win">Win (+)</option>
                    <option value="Loss">Loss (-)</option>
                </select>
            </div>

            <div class="input-group" id="custom-rr-group">
                <label for="custom-rr">Profit RR (+)</label>
                <input type="number" id="custom-rr" step="0.1" min="0.1" placeholder="e.g. 2.5" inputmode="decimal">
            </div>

            <!-- New Amount Gained/Lost Input -->
            <div class="input-group">
                <label for="trade-amount">Amount Gained / Lost ($)</label>
                <input type="number" id="trade-amount" step="0.01" placeholder="e.g. 500 for win, -250 for loss" required>
            </div>

            <button type="submit">Log Trade</button>
        </form>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Pair</th>
                        <th>Result</th>
                        <th>RR</th>
                        <th>PnL</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="trade-list"></tbody>
            </table>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed:', err));
            });
        }
    </script>

    <script type="module">
        // Added 'collection' to imports to handle new plans system
        import { auth, db, tradesCol, collection, addDoc, deleteDoc, doc, query, orderBy, where, onSnapshot, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from './firebase.js';
        import { initChart, updateChart } from './chart.js';

        const plansCol = collection(db, 'plans');
        
        let trades = [];
        let plans = [];
        let currentUser = null;
        let activeAccountId = null;
        let activeAccountSize = 0;
        
        let unsubscribeTrades = null;
        let unsubscribePlans = null;
        let pendingDeleteId = null;

        // DOM Elements
        const authContainer = document.getElementById('auth-container');
        const appContainer  = document.getElementById('app-container');
        const dateDisplay   = document.getElementById('calendar-info');
        const form          = document.getElementById('trade-form');
        const outcomeSelect = document.getElementById('outcome');
        const customRrGroup = document.getElementById('custom-rr-group');
        const customRrInput = document.getElementById('custom-rr');
        const pairSelect    = document.getElementById('pair');
        const customPairGroup = document.getElementById('custom-pair-group');
        const customPairInput = document.getElementById('custom-pair');
        const tradeAmountInput = document.getElementById('trade-amount');
        const deleteModal   = document.getElementById('delete-modal');
        const planModal     = document.getElementById('plan-modal');
        const planForm      = document.getElementById('plan-form');
        const accountSelector = document.getElementById('account-selector');

        // ── Calendar Helper ──────────────────────────────────────
        function getCalendarInfo() {
            const now = new Date();
            const month = now.toLocaleString('default', { month: 'long' });
            const dayOfMonth = now.getDate();
            let week = Math.ceil(dayOfMonth / 7);
            if (week > 4) week = 4;
            return { month, week, fullDate: now.toLocaleDateString() };
        }
        dateDisplay.textContent = `${getCalendarInfo().month} - Wk ${getCalendarInfo().week}`;

        // ── Auth State ───────────────────────────────────────────
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authContainer.style.display = 'none';
                initChart('equityChart');
                loadUserPlans(user.uid);
            } else {
                currentUser = null;
                authContainer.style.display = 'block';
                appContainer.style.display  = 'none';
                if (unsubscribeTrades) unsubscribeTrades();
                if (unsubscribePlans) unsubscribePlans();
            }
        });

        // ── Auth Actions ─────────────────────────────────────────
        document.getElementById('login-btn').addEventListener('click', async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
            } catch (error) { alert("Login failed: " + error.message); }
        });

        document.getElementById('signup-btn').addEventListener('click', async () => {
            try {
                await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
            } catch (error) { alert("Signup failed: " + error.message); }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await signOut(auth);
        });

        // ── Plan & Account Selection Logic ───────────────────────
        document.getElementById('new-plan-btn').addEventListener('click', () => {
            planModal.classList.add('active');
        });

        planForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            
            const newPlan = {
                userId: currentUser.uid,
                traderName: document.getElementById('trader-name').value,
                accountName: document.getElementById('account-name').value,
                accountSize: parseFloat(document.getElementById('account-size').value),
                timestamp: Date.now()
            };

            await addDoc(plansCol, newPlan);
            planForm.reset();
            planModal.classList.remove('active');
        });

        accountSelector.addEventListener('change', (e) => {
            activeAccountId = e.target.value;
            const selectedPlan = plans.find(p => p.id === activeAccountId);
            activeAccountSize = selectedPlan.accountSize;
            document.getElementById('welcome-msg').textContent = `Welcome, Trader ${selectedPlan.traderName}`;
            loadUserTrades(activeAccountId);
        });

        function loadUserPlans(uid) {
            const q = query(plansCol, where("userId", "==", uid), orderBy("timestamp", "asc"));
            unsubscribePlans = onSnapshot(q, (snapshot) => {
                plans = [];
                snapshot.forEach((d) => plans.push({ id: d.id, ...d.data() }));

                if (plans.length === 0) {
                    appContainer.style.display = 'none';
                    planModal.classList.add('active');
                } else {
                    appContainer.style.display = 'block';
                    planModal.classList.remove('active');
                    
                    // Populate select
                    accountSelector.innerHTML = '';
                    plans.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = p.accountName;
                        accountSelector.appendChild(opt);
                    });

                    // Set Active Account
                    if (!activeAccountId || !plans.find(p => p.id === activeAccountId)) {
                        activeAccountId = plans[0].id;
                        activeAccountSize = plans[0].accountSize;
                        document.getElementById('welcome-msg').textContent = `Welcome, Trader ${plans[0].traderName}`;
                 loadUserTrades(activeAccountId);
        });

        function loadUserPlans(uid) {
            const q = query(plansCol, where("userId", "==", uid), orderBy("timestamp", "asc"));
            unsubscribePlans = onSnapshot(q, (snapshot) => {
                plans = [];
                snapshot.forEach((d) => plans.push({ id: d.id, ...d.data() }));

                if (plans.length === 0) {
                    appContainer.style.display = 'none';
                    planModal.classList.add('active');
                } else {
                    appContainer.style.display = 'block';
                    planModal.classList.remove('active');
                    
                    // Populate select
                    accountSelector.innerHTML = '';
                    plans.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = p.accountName;
                        accountSelector.appendChild(opt);
                    });

                    // Set Active Account
                    if (!activeAccountId || !plans.find(p => p.id === activeAccountId)) {
                        activeAccountId = plans[0].id;
                        activeAccountSize = plans[0].accountSize;
                        document.getElementById('welcome-msg').textContent = `Welcome, Trader ${plans[0].traderName}`;
                    }
                    accountSelector.value = activeAccountId;
                    loadUserTrades(activeAccountId);
                }
            });
        }

        // ── UI Triggers ──────────────────────────────────────────
        pairSelect.addEventListener('change', () => {
            if (pairSelect.value === 'Other') {
                customPairGroup.style.display = 'flex';
                customPairInput.required = true;
            } else {
                customPairGroup.style.display = 'none';
                customPairInput.required = false;
                customPairInput.value = '';
            }
        });

        outcomeSelect.addEventListener('change', (e) => {
            if (e.target.value === 'Win') {
                customRrGroup.style.display = 'flex';
                customRrInput.required = true;
            } else {
                customRrGroup.style.display = 'none';
                customRrInput.required = false;
                customRrInput.value = '';
            }
        });

        // ── Delete Modal Logic ───────────────────────────────────
        function openDeleteModal(tradeId) {
            pendingDeleteId = tradeId;
            deleteModal.classList.add('active');
        }

        function closeDeleteModal() {
            pendingDeleteId = null;
            deleteModal.classList.remove('active');
        }

        document.getElementById('modal-yes-btn').addEventListener('click', async () => {
            if (pendingDeleteId) {
                await deleteDoc(doc(db, 'trades', pendingDeleteId));
            }
            closeDeleteModal();
        });

        document.getElementById('modal-no-btn').addEventListener('click', () => closeDeleteModal());
        deleteModal.addEventListener('click', (e) => { if (e.target === deleteModal) closeDeleteModal(); });
        planModal.addEventListener('click', (e) => { 
            // Only allow closing if they have at least 1 plan
            if (e.target === planModal && plans.length > 0) planModal.classList.remove('active'); 
        });

        // ── Render ───────────────────────────────────────────────
        function renderDashboard() {
            const list         = document.getElementById('trade-list');
            const totalRrDisplay = document.getElementById('total-rr-display');
            const totalPnlDisplay = document.getElementById('total-pnl-display');
            const roiDisplay   = document.getElementById('roi-display');
            const pfDisplay    = document.getElementById('pf-display');
            
            list.innerHTML = '';

            const currentMonth = getCalendarInfo().month;
            let monthlyGrossProfit = 0;
            let monthlyGrossLoss   = 0;
            let monthlyNetRR       = 0;
            let totalPnL           = 0;

            let chartLabels  = ['Start'];
            let chartData    = [0];
            let cumulativePnL = 0; // Using PnL for the chart logic instead of RR

            const sortedTrades = [...trades].sort((a, b) => a.timestamp - b.timestamp);

            sortedTrades.forEach(trade => {
                totalPnL += trade.amount;
                cumulativePnL += trade.amount;
                
                chartLabels.push(trade.date);
                chartData.push(cumulativePnL); // Assuming Chart tracks PnL now

                if (trade.month === currentMonth) {
                    monthlyNetRR += trade.rr;
                    if (trade.amount > 0) monthlyGrossProfit += trade.amount;
                    if (trade.amount < 0) monthlyGrossLoss   += Math.abs(trade.amount);
                }
            });

            updateChart(chartLabels, chartData);

            let profitFactor;
            if (monthlyGrossLoss === 0) {
                profitFactor = monthlyGrossProfit > 0 ? "Max" : "0.00";
            } else {
                profitFactor = (monthlyGrossProfit / monthlyGrossLoss).toFixed(2);
            }

            let roiPercentage = activeAccountSize > 0 ? (totalPnL / activeAccountSize) * 100 : 0;

            // Render rows newest first
            [...sortedTrades].reverse().forEach(trade => {
                const tr      = document.createElement('tr');
                const isWin   = trade.amount >= 0;
                const rrClass = isWin ? 'win' : 'loss';
                const rrPrefix = isWin && trade.outcome === 'Win' ? '+' : '';
                const pnlPrefix = isWin ? '+$' : '-$';

                tr.innerHTML = `
                    <td>
                        <div style="font-size: 0.85rem;">${trade.date}</div>
                        <div style="font-size: 0.7rem; color: #a09cbb;">Wk ${trade.week}</div>
                    </td>
                    <td>
                        <div style="font-weight: bold;">${trade.pair}</div>
                        <div style="font-size: 0.7rem; color: #a09cbb;">${trade.bias}</div>
                    </td>
                    <td class="${rrClass}">${trade.outcome}</td>
                    <td class="${rrClass}">${rrPrefix}${trade.rr}</td>
                    <td class="${rrClass}">${pnlPrefix}${Math.abs(trade.amount).toFixed(2)}</td>
                    <td><button class="delete-btn" data-id="${trade.id}">X</button></td>
                `;
                list.appendChild(tr);
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    openDeleteModal(e.target.getAttribute('data-id'));
                });
            });

            totalRrDisplay.textContent  = `${monthlyNetRR > 0 ? '+' : ''}${monthlyNetRR.toFixed(2)} RR`;
            totalRrDisplay.style.color  = monthlyNetRR >= 0 ? '#00ffcc' : '#ff3366';
            
            totalPnlDisplay.textContent = `${totalPnL >= 0 ? '+' : '-'}$${Math.abs(totalPnL).toFixed(2)}`;
            totalPnlDisplay.style.color = totalPnL >= 0 ? '#00ffcc' : '#ff3366';

            roiDisplay.textContent = `${roiPercentage > 0 ? '+' : ''}${roiPercentage.toFixed(2)}%`;
            roiDisplay.style.color = roiPercentage >= 0 ? '#00ffcc' : '#ff3366';

            pfDisplay.textContent  = profitFactor;
        }

        // ── Firestore Listener ───────────────────────────────────
        function loadUserTrades(accountId) {
            if (!accountId) return;
            if (unsubscribeTrades) unsubscribeTrades();

            const q = query(tradesCol, where("accountId", "==", accountId), orderBy('timestamp', 'desc'));
            unsubscribeTrades = onSnapshot(q, (snapshot) => {
                trades = [];
                snapshot.forEach((d) => {
                    trades.push({ id: d.id, ...d.data() });
                });
                renderDashboard();
            });
        }

        // ── Submit Trade ─────────────────────────────────────────
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser || !activeAccountId) return;

            const pair = pairSelect.value === 'Other'
                ? customPairInput.value.trim().toUpperCase()
                : pairSelect.value;

            const bias    = document.getElementById('bias').value;
            const outcome = document.getElementById('outcome').value;
            const rrValue = outcome === 'Loss' ? -1 : parseFloat(customRrInput.value);
            const amount  = parseFloat(tradeAmountInput.value);
            const info    = getCalendarInfo();

            const newTrade = {
                userId: currentUser.uid,
                accountId: activeAccountId,
                timestamp: Date.now(),
                date: info.fullDate,
                month: info.month,
                week: info.week,
                pair,
                bias,
                outcome,
                rr: rrValue,
                amount: amount
            };

            await addDoc(tradesCol, newTrade);
            form.reset();
            customRrGroup.style.display   = 'none';
            customPairGroup.style.display = 'none';
        });
    </script>
</body>
</html>
