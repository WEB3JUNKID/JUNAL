<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0914">
    <link rel="manifest" href="manifest.json">
    <title>Euphoria Journal</title>
    <style>
        :root {
            --primary-glow: #b14bf4;
            --secondary-glow: #00d2ff;
            --bg-color: #0b0914;
            --glass-bg: rgba(20, 15, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, #1a0b2e 0%, var(--bg-color) 40%, #060b19 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 800px;
            min-height: 100vh; /* Better for mobile app feel */
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 20px 20px 20px; /* Extra top padding for mobile status bar */
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            background: linear-gradient(to right, var(--secondary-glow), var(--primary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #calendar-info {
            color: #a09cbb;
            font-size: 1.1rem;
            margin-top: 5px;
            font-weight: 500;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        input, select, button {
            padding: 14px 15px; /* Larger touch targets for mobile */
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(177, 75, 244, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        select option {
            background: var(--bg-color);
            color: #fff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: #a09cbb;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #custom-rr-group {
            display: none;
        }

        button {
            background: linear-gradient(45deg, var(--primary-glow), #7a1fd4);
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            border: none;
        }

        button:active {
            transform: scale(0.98);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            border-left: 4px solid var(--secondary-glow);
        }

        .table-wrapper {
            overflow-x: auto; /* Allows table to scroll sideways on small phones */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 350px;
        }

        th, td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
        }

        th {
            color: #a09cbb;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .win { color: #00ffcc; font-weight: bold; }
        .loss { color: #ff3366; font-weight: bold; }
        
        .delete-btn {
            background: transparent;
            color: #ff3366;
            padding: 6px 12px;
            font-size: 0.8rem;
            border: 1px solid #ff3366;
            margin: 0;
            width: auto;
        }
        
        .delete-btn:active {
            background: rgba(255, 51, 102, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Trade Journal</h1>
            <div id="calendar-info">Loading date...</div>
        </header>

        <form id="trade-form">
            <div class="input-group">
                <label for="pair">Pair</label>
                <input list="pairs-list" id="pair" placeholder="e.g. GBP/USD" required autocomplete="off">
                <datalist id="pairs-list">
                    <option value="GBP/USD">
                    <option value="SOL/USD">
                    <option value="XAU/USD">
                </datalist>
            </div>

            <div class="input-group">
                <label for="bias">Bias</label>
                <select id="bias" required>
                    <option value="" disabled selected>Select Bias</option>
                    <option value="Long">Long</option>
                    <option value="Short">Short</option>
                </select>
            </div>

            <div class="input-group">
                <label for="outcome">Outcome</label>
                <select id="outcome" required>
                    <option value="" disabled selected>Win or Loss?</option>
                    <option value="Win">Win (+)</option>
                    <option value="Loss">Loss (-1)</option>
                </select>
            </div>

            <div class="input-group" id="custom-rr-group">
                <label for="custom-rr">Profit RR (+)</label>
                <input type="number" id="custom-rr" step="0.1" min="0.1" placeholder="e.g. 2.5" inputmode="decimal">
            </div>

            <button type="submit">Log Trade</button>
        </form>

        <div class="stats">
            <span>Monthly PnL:</span>
            <span id="total-rr-display" style="font-weight: bold; color: var(--secondary-glow);">0 RR</span>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Pair</th>
                        <th>Result</th>
                        <th>RR</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="trade-list">
                    <!-- Trades will populate here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- Service Worker Registration for PWA ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('PWA Service Worker registered!', reg);
                }).catch(err => {
                    console.log('PWA Service Worker failed:', err);
                });
            });
        }

        // --- App Logic ---
        let trades = JSON.parse(localStorage.getItem('euphoriaTrades')) || [];
        const dateDisplay = document.getElementById('calendar-info');
        
        function getCalendarInfo() {
            const now = new Date();
            const month = now.toLocaleString('default', { month: 'long' });
            const dayOfMonth = now.getDate();
            
            let week = Math.ceil(dayOfMonth / 7);
            if (week > 4) week = 4; // Cap at 4 weeks per month

            return { month, week, fullDate: now.toLocaleDateString() };
        }

        function updateHeader() {
            const info = getCalendarInfo();
            dateDisplay.textContent = `${info.month} - Week ${info.week}`;
        }

        const form = document.getElementById('trade-form');
        const outcomeSelect = document.getElementById('outcome');
        const customRrGroup = document.getElementById('custom-rr-group');
        const customRrInput = document.getElementById('custom-rr');

        outcomeSelect.addEventListener('change', (e) => {
            if (e.target.value === 'Win') {
                customRrGroup.style.display = 'flex';
                customRrInput.required = true;
            } else {
                customRrGroup.style.display = 'none';
                customRrInput.required = false;
                customRrInput.value = '';
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const pair = document.getElementById('pair').value.toUpperCase();
            const bias = document.getElementById('bias').value;
            const outcome = document.getElementById('outcome').value;
            
            let rrValue = outcome === 'Loss' ? -1 : parseFloat(customRrInput.value);
            const info = getCalendarInfo();

            const newTrade = {
                id: Date.now(),
                date: info.fullDate,
                month: info.month,
                week: info.week,
                pair,
                bias,
                outcome,
                rr: rrValue
            };

            trades.push(newTrade);
            saveData();
            renderTrades();
            form.reset();
            customRrGroup.style.display = 'none';
            // Blur inputs on mobile to close keyboard
            document.activeElement.blur(); 
        });

        function deleteTrade(id) {
            trades = trades.filter(trade => trade.id !== id);
            saveData();
            renderTrades();
        }

        function saveData() {
            localStorage.setItem('euphoriaTrades', JSON.stringify(trades));
        }

        function renderTrades() {
            const list = document.getElementById('trade-list');
            const totalDisplay = document.getElementById('total-rr-display');
            list.innerHTML = '';

            let totalRR = 0;
            const currentMonth = getCalendarInfo().month;

            trades.forEach(trade => {
                if (trade.month === currentMonth) {
                    totalRR += trade.rr;
                }

                const tr = document.createElement('tr');
                const rrClass = trade.outcome === 'Win' ? 'win' : 'loss';
                const rrPrefix = trade.outcome === 'Win' ? '+' : '';

                tr.innerHTML = `
                    <td>
                        <div style="font-size: 0.85rem;">${trade.date}</div>
                        <div style="font-size: 0.7rem; color: #a09cbb;">Wk ${trade.week}</div>
                    </td>
                    <td>
                        <div style="font-weight: bold;">${trade.pair}</div>
                        <div style="font-size: 0.7rem; color: #a09cbb;">${trade.bias}</div>
                    </td>
                    <td class="${rrClass}">${trade.outcome}</td>
                    <td class="${rrClass}">${rrPrefix}${trade.rr}</td>
                    <td><button class="delete-btn" onclick="deleteTrade(${trade.id})">X</button></td>
                `;
                list.prepend(tr);
            });

            totalDisplay.textContent = `${totalRR > 0 ? '+' : ''}${totalRR.toFixed(2)} RR`;
            totalDisplay.style.color = totalRR >= 0 ? '#00ffcc' : '#ff3366';
        }

        updateHeader();
        renderTrades();
    </script>
</body>
                  </html>
